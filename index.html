<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dairy Classic — Uzbekistan’s Best Ice Cream Brand, since 1996</title>
  <meta name="description" content="Dairy Classic: Uzbekistan’s best ice cream brand since 1996. Cones, sticks, cups, biscuit, cassatta and tubs, made in Tashkent at 80,000 litres a day. Retail and wholesale.">
  <meta name="theme-color" content="#0B0807">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fraunces on its own link so an axis change can never break the other families -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&display=swap">
  <!-- Instrument Serif / Fraunces have no Cyrillic: Cormorant Garamond + Playfair Display cover Russian glyphs -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Playfair+Display:wght@800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="preload" href="js/config.js" as="script">
  <link rel="preload" href="media/brand/logo.png" as="image">
  <link rel="icon" href="media/brand/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="cursor" aria-hidden="true">
    <div class="cursor__ring"><span class="cursor__label"></span></div>
    <div class="cursor__dot"></div>
  </div>

  <!-- 3.0 Loader -->
  <div class="loader" role="status" aria-live="polite">
    <div class="loader__mark">
      <img class="loader__logo" data-logo alt="Dairy Classic · Since 1996" width="114" height="133">
      <span class="loader__word">Dairy <em>Classic</em></span>
      <span class="loader__bar"><i></i></span>
      <span class="loader__caption mono" data-i18n="loader"></span>
    </div>
  </div>
  <div class="curtain" aria-hidden="true"></div>

  <!-- 3.1 Header -->
  <header class="header">
    <a class="brand" href="#top" data-scroll-to="#top" aria-label="Dairy Classic">
      <img class="brand__logo" data-logo alt="" width="28" height="33">
      <span class="brand__word">Dairy Classic</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="#churn" data-scroll-to="#churn" data-i18n-roll="nav.churn"></a>
      <a href="#ingredients" data-scroll-to="#ingredients" data-i18n-roll="nav.ingredients"></a>
      <a href="#range" data-scroll-to="#range" data-i18n-roll="nav.range"></a>
      <a href="#cold" data-scroll-to="#cold" data-i18n-roll="nav.cold"></a>
      <a href="#partner" data-scroll-to="#partner" data-i18n-roll="nav.partner"></a>
    </nav>
    <div class="header__right">
      <span class="status mono"><i class="pulse"></i><span class="status__text"></span></span>
      <div class="lang mono" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><span>/</span><button type="button" data-lang="ru">RU</button>
      </div>
      <a class="btn btn--ghost btn--sm header__cta" href="#partner" data-scroll-to="#partner"><span class="btn__label" data-i18n="cta"></span></a>
      <button class="burger mono" type="button" aria-expanded="false" aria-controls="menu"><span data-i18n="nav.menu"></span><i></i></button>
    </div>
  </header>

  <!-- Mobile overlay menu -->
  <div class="menu" id="menu" aria-hidden="true">
    <nav class="menu__links">
      <a href="#churn" data-scroll-to="#churn"><span class="menu__num mono">01</span><span data-i18n="nav.churn"></span></a>
      <a href="#ingredients" data-scroll-to="#ingredients"><span class="menu__num mono">02</span><span data-i18n="nav.ingredients"></span></a>
      <a href="#range" data-scroll-to="#range"><span class="menu__num mono">03</span><span data-i18n="nav.range"></span></a>
      <a href="#cold" data-scroll-to="#cold"><span class="menu__num mono">04</span><span data-i18n="nav.cold"></span></a>
      <a href="#partner" data-scroll-to="#partner"><span class="menu__num mono">05</span><span data-i18n="nav.partner"></span></a>
    </nav>
    <div class="menu__foot">
      <span class="status mono"><i class="pulse"></i><span class="status__text"></span></span>
      <a class="btn btn--solid" href="#partner" data-scroll-to="#partner"><span class="btn__label" data-i18n="cta"></span><span class="btn__arrow">→</span></a>
    </div>
  </div>

  <main>
    <!-- 3.2 Hero -->
    <section class="hero" id="top" aria-label="Dairy Classic range">
      <div class="hero__inner">
        <div class="hero__word" aria-hidden="true"></div>

        <div class="hero__stage" data-cursor="DRAG">
          <div class="hero__films"></div>
          <div class="badge" aria-hidden="true">
            <svg class="badge__ring" viewBox="0 0 100 100">
              <defs><path id="badgePath" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs>
              <text><textPath href="#badgePath" class="badge__text"></textPath></text>
            </svg>
            <span class="badge__icon"></span>
          </div>
        </div>

        <div class="hero__info">
          <p class="eyebrow mono"><i class="pulse pulse--static"></i><span data-i18n="hero.eyebrow"></span></p>
          <div class="hero__num"><span class="hero__idx"></span><span class="hero__total mono"></span></div>
          <p class="hero__cat mono"></p>
          <h1 class="hero__title"></h1>
          <p class="hero__desc"></p>
          <div class="hero__pack">
            <span class="hero__pack-text"></span>
            <a class="link-plus" href="#partner" data-scroll-to="#partner"><span data-i18n="hero.request"></span><i>+</i></a>
          </div>
        </div>

        <aside class="hero__list">
          <p class="mono hero__list-title" data-i18n="hero.range"></p>
          <ol></ol>
        </aside>

        <div class="hero__dots" aria-hidden="true"><div class="hero__dots-row"></div><span class="hero__dots-name"></span></div>

        <div class="hero__bar">
          <span class="mono hero__scroll" data-i18n="hero.scroll"></span>
          <span class="hero__progress"><i></i></span>
          <span class="hero__ru">Дэйри Классик</span>
        </div>
      </div>
    </section>

    <!-- 3.3 Marquee -->
    <section class="marquee" aria-hidden="true">
      <div class="marquee__row"><div class="marquee__track"></div></div>
      <div class="marquee__row"><div class="marquee__track"></div></div>
    </section>

    <!-- 3.4 Manifesto -->
    <section class="manifesto section" id="churn">
      <div class="wrap">
        <p class="label"><span class="label__num">01</span><i class="label__line"></i><span data-i18n="manifesto.label"></span></p>
        <p class="manifesto__text"></p>
      </div>
    </section>

    <!-- 3.5 Process -->
    <section class="steps" aria-label="Process">
      <div class="steps__pin">
        <div class="steps__head wrap">
          <div>
            <p class="label"><span class="label__num">02</span><i class="label__line"></i><span data-i18n="steps.label"></span></p>
            <h2 class="h2" data-i18n="steps.title"></h2>
          </div>
          <div class="steps__meta">
            <span class="mono muted" data-i18n="steps.hint"></span>
            <span class="steps__progress"><i></i></span>
          </div>
        </div>
        <div class="steps__track"></div>
      </div>
    </section>

    <!-- 3.6 Fly-through mask -->
    <section class="fly" aria-label="Thirty years, same recipe">
      <div class="fly__inner">
        <div class="fly__media"></div>
        <svg class="fly__svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <mask id="flyMask" maskUnits="userSpaceOnUse" x="-6000" y="-6000" width="13600" height="12900">
              <rect x="-6000" y="-6000" width="13600" height="12900" fill="#fff"/>
              <text class="fly__text" x="800" y="450" text-anchor="middle" dominant-baseline="central"></text>
            </mask>
          </defs>
          <rect x="-6000" y="-6000" width="13600" height="12900" fill="#0B0807" mask="url(#flyMask)"/>
        </svg>
        <p class="fly__line h2" data-i18n="fly.line"></p>
      </div>
    </section>

    <!-- 3.7 Ingredients -->
    <section class="ingredients section" id="ingredients">
      <div class="wrap ingredients__grid">
        <div class="ingredients__aside">
          <p class="label"><span class="label__num">03</span><i class="label__line"></i><span data-i18n="ingredients.label"></span></p>
          <h2 class="h2" data-i18n="ingredients.title"></h2>
          <p class="body muted" data-i18n="ingredients.note"></p>
          <div class="ingredients__media" data-cursor="VIEW"></div>
        </div>
        <ol class="ingredients__list"></ol>
      </div>
    </section>

    <!-- 3.8 Range -->
    <section class="range section" id="range">
      <div class="wrap">
        <div class="range__head">
          <div>
            <p class="label"><span class="label__num">04</span><i class="label__line"></i><span data-i18n="range.label"></span></p>
            <h2 class="h2" data-i18n="range.title"></h2>
          </div>
          <p class="range__note body muted"></p>
        </div>
        <ol class="sig"></ol>

        <div class="cat">
          <p class="mono cat__title" data-i18n="range.catalogue"></p>
          <div class="cat__tabs" role="tablist"></div>
          <ul class="cat__list"></ul>
          <p class="mono muted cat__foot" data-i18n="range.footnote"></p>
        </div>
      </div>
      <div class="float" aria-hidden="true"></div>
    </section>

    <!-- 3.9 Cold chain -->
    <section class="cold section" id="cold">
      <canvas class="cold__canvas" aria-hidden="true"></canvas>
      <div class="cold__fog" aria-hidden="true"><i></i><i></i></div>
      <div class="wrap">
        <div class="cold__top">
          <div class="cold__copy">
            <p class="label"><span class="label__num">05</span><i class="label__line"></i><span data-i18n="cold.label"></span></p>
            <h2 class="h2" data-i18n="cold.title"></h2>
            <p class="body muted" data-i18n="cold.text"></p>
          </div>
          <div class="cold__counter">
            <span class="cold__num">20</span><sup>°C</sup>
            <span class="mono muted cold__cap" data-i18n="cold.counter"></span>
          </div>
        </div>
        <div class="cold__cards"></div>
      </div>
    </section>

    <!-- 3.10 Kinetic pour -->
    <section class="pour" aria-label="Milk, cream, time">
      <div class="pour__inner">
        <div class="pour__media"></div>
        <div class="pour__shade"></div>
        <div class="pour__words"></div>
        <div class="pour__cards"></div>
      </div>
    </section>

    <!-- 3.11 Promises -->
    <section class="promises" aria-label="Our promises">
      <div class="promises__inner wrap">
        <p class="label"><span class="label__num">06</span><i class="label__line"></i><span data-i18n="promises.label"></span></p>
        <div class="promises__stage"></div>
        <p class="mono promises__counter"><span data-i18n="promises.counter"></span> <span class="promises__no">01</span></p>
      </div>
    </section>

    <!-- 3.12 Partner -->
    <section class="partner section" id="partner">
      <div class="partner__bg" aria-hidden="true"></div>
      <div class="wrap">
        <p class="label"><span class="label__num">07</span><i class="label__line"></i><span data-i18n="partner.label"></span></p>
        <h2 class="h1" data-i18n="partner.title"></h2>
        <p class="body muted partner__text" data-i18n="partner.text"></p>

        <div class="stats"></div>

        <div class="partner__grid">
          <div class="partner__side">
            <div class="live">
              <p class="mono live__title"><i class="pulse"></i><span class="status__text"></span></p>
              <div class="live__clocks"></div>
            </div>
            <dl class="info"></dl>
          </div>

          <form class="form" novalidate>
            <p class="mono form__title" data-i18n="partner.form.title"></p>
            <div class="form__grid"></div>
            <div class="form__foot">
              <button class="btn btn--solid btn--submit" type="submit">
                <span class="btn__label" data-i18n="partner.form.submit"></span>
                <svg class="btn__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
              </button>
              <p class="form__msg mono" role="status" aria-live="polite"></p>
            </div>
          </form>
        </div>

        <div class="partner__actions">
          <a class="btn btn--solid" data-href="call"><span class="btn__label" data-i18n="partner.call"></span><span class="btn__arrow">→</span></a>
          <a class="btn btn--ghost" data-href="telegram" target="_blank" rel="noopener"><span class="btn__label" data-i18n="partner.telegramBtn"></span></a>
          <a class="btn btn--ghost" data-href="instagram" target="_blank" rel="noopener"><span class="btn__label" data-i18n="partner.instagramBtn"></span></a>
        </div>
      </div>
    </section>
  </main>

  <!-- 3.13 Footer -->
  <footer class="footer">
    <div class="wrap footer__cols"></div>
    <div class="wrap footer__legal mono muted">
      <span>© <span class="footer__year"></span> Dairy Classic · <span data-i18n="footer.rights"></span></span>
      <a href="#top" data-scroll-to="#top" class="link-plus"><span data-i18n="footer.top"></span><i>+</i></a>
    </div>
    <div class="footer__mark" aria-hidden="true"><span class="footer__word">DAIRY CLASSIC</span></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
